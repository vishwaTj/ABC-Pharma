<div class="dialog-header">
    <h2 mat-dialog-title>Sales History</h2>

    <button mat-icon-button mat-dialog-close aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content>

    <table mat-table [dataSource]="sales" class="sales-table">

        <ng-container matColumnDef="medicineName">
            <th mat-header-cell *matHeaderCellDef>Medicine</th>
            <td mat-cell *matCellDef="let sale">
                {{ sale.medicineName }}
            </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef>Quantity</th>
            <td mat-cell *matCellDef="let sale">
                {{ sale.quantity }}
            </td>
        </ng-container>

        <ng-container matColumnDef="unitPrice">
            <th mat-header-cell *matHeaderCellDef>Unit Price</th>
            <td mat-cell *matCellDef="let sale">
                {{ sale.unitPrice | currency:'INR' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="totalAmount">
            <th mat-header-cell *matHeaderCellDef>Total</th>
            <td mat-cell *matCellDef="let sale">
                {{ sale.totalAmount | currency:'INR' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="soldAt">
            <th mat-header-cell *matHeaderCellDef>Sold At</th>
            <td mat-cell *matCellDef="let sale">
                {{ sale.soldAt | date:'dd-MMM-yyyy, hh:mm a' }}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <p *ngIf="sales.length === 0" class="empty-message">
        No sales recorded yet.
    </p>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
