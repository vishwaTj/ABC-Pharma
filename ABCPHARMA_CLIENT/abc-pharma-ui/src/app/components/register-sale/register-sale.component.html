<div class="dialog-header">
    <h2 mat-dialog-title>Register Sale</h2>

    <button mat-icon-button mat-dialog-close aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content>
    <form #saleForm="ngForm">

        <mat-form-field appearance="outline">
            <mat-label>Select Medicine</mat-label>
            <mat-select name="medicine" [(ngModel)]="selectedMedicineId" required>

                <mat-option *ngFor="let medicine of medicines" [value]="medicine.id">
                    {{ medicine.fullName }} (Stock: {{ medicine.quantity }})
                </mat-option>

            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" name="quantity" [(ngModel)]="quantity" min="1"
                [max]="selectedMedicine?.quantity ?? 0" required>
        </mat-form-field>

        <div class="sale-summary" *ngIf="selectedMedicine">
            <p>Unit Price: {{ selectedMedicine.price | currency:'INR' }}</p>
            <p>Available Stock: {{ selectedMedicine.quantity }}</p>
            <h3>Total Amount: {{ totalAmount | currency:'INR' }}</h3>
        </div>

        <p class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
        </p>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>

    <button mat-flat-button color="primary"
        [disabled]="saleForm.invalid || !selectedMedicine || quantity < 1 || quantity > selectedMedicine.quantity"
        (click)="registerSale()">
        Register Sale
    </button>
</mat-dialog-actions>
