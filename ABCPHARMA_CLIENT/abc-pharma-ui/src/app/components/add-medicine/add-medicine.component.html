<div>
    <h2 mat-dialog-title>Add Medicine</h2>
</div>

<mat-dialog-content>
    <form #medicineForm="ngForm">
        <mat-form-field appearance="outline">
            <mat-label>Medicine Name</mat-label>
            <input matInput name="fullName" [(ngModel)]="medicine.fullName" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Brand</mat-label>
            <input matInput name="brand" [(ngModel)]="medicine.brand" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Notes</mat-label>
            <textarea matInput name="notes" [(ngModel)]="medicine.notes"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Expiry Date</mat-label>
            <input matInput type="date" name="expiryDate" [(ngModel)]="medicine.expiryDate" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" name="quantity" [(ngModel)]="medicine.quantity" min="0" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Price</mat-label>
            <input matInput type="number" name="price" [(ngModel)]="medicine.price" min="0" step="0.01" required>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" [disabled]="medicineForm.invalid" (click)="saveMedicine()">
        Save
    </button>
</mat-dialog-actions>
