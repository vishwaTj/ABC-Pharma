<div class="medicine-list-container">
    <h2>ABC Pharmacy</h2>

    <div class="action-buttons">
        <div class="toolbar">
            <input type="text" placeholder="Search medicine by name..." [(ngModel)]="searchText"
                (input)="searchMedicines()" />
        </div>

        <div class="buttons">
            <button mat-flat-button color="primary" (click)="openAddMedicineDialog()">
                + Add Medicine
            </button>

            <button mat-flat-button color="accent" (click)="openRegisterSaleDialog()">
                Register Sale
            </button>

            <button mat-stroked-button (click)="openSalesHistoryDialog()">
                View Sales
            </button>
        </div>
    </div>

    <table mat-table [dataSource]="filteredMedicines" class="medicine-table">

        <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>Medicine Name</th>
            <td mat-cell *matCellDef="let medicine">
                {{ medicine.fullName }}
            </td>
        </ng-container>

        <ng-container matColumnDef="brand">
            <th mat-header-cell *matHeaderCellDef>Brand</th>
            <td mat-cell *matCellDef="let medicine">
                {{ medicine.brand }}
            </td>
        </ng-container>

        <ng-container matColumnDef="expiryDate">
            <th mat-header-cell *matHeaderCellDef>Expiry Date</th>
            <td mat-cell *matCellDef="let medicine">
                {{ medicine.expiryDate | date:'dd-MMM-yyyy' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef>Quantity</th>
            <td mat-cell *matCellDef="let medicine">
                {{ medicine.quantity }}
            </td>
        </ng-container>

        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>Price</th>
            <td mat-cell *matCellDef="let medicine">
                {{ medicine.price | currency:'INR' }}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns" [ngClass]="getRowClass(row)">
        </tr>

    </table>

    <p *ngIf="filteredMedicines.length === 0">
        No medicines found.
    </p>

</div>
